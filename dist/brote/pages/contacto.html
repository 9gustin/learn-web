    <header>

    <main>
      <p>
        CONVERSEMOS
      </p>
      <h1>
        Hagamos lugar al verde.
      </h1>
      <p>
        Córdoba, Argentina · Negocio de ejemplo
      </p>
      <form onsubmit="event.preventDefault();document.getElementById('estado').textContent='¡Formulario válido! Esta demostración no envía mensajes.'">
        <label>
          Tu nombre
          <input required name="nombre" autocomplete="name">
        </label>
        <label>
          Email
          <input required type="email" name="email" autocomplete="email">
        </label>
        <label>
          Tu consulta
          <textarea required name="consulta" rows="4">
          </textarea>
        </label>
        <button>
          Probar formulario
        </button>
        <p id="estado" role="status">
        </p>
      </form>
    </main>
    <footer>
      <span>
        ❧ Brote · Un poco más de verde
      </span>
      <span>
        Proyecto educativo · Negocio ficticio
      </span>
    </footer>
